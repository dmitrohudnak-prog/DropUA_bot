<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop.ua — Магазин одягу</title>
    <!-- Підключаємо Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f0c;
            --card-bg: #121a15;
            --accent-green: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.2);
            --text-main: #ffffff;
            --text-muted: #8c9e93;
            --border-color: #1f3325;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050806 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }

        header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 12, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--accent-green);
            object-fit: cover;
        }

        .logo-container h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: 0.5px;
        }

        .search-box {
            padding: 12px 16px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .categories-scroll {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .chip.active {
            background: var(--accent-green);
            color: #000;
            font-weight: 600;
            border-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .container {
            padding: 0 16px;
            flex: 1;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .empty-state p {
            margin-top: 10px;
            font-size: 14px;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(11, 15, 12, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Зверни увагу: тут вказано logo.jpg як ти і просив -->
            <img src="logo.jpg" alt="Logo" onerror="this.src='https://via.placeholder.com/50/00ff66/000000?text=D'">
            <h1>Drop.ua</h1>
        </div>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Пошук: худі, куртка, кросівки...">
    </div>

    <div class="categories-scroll">
        <button class="chip active" onclick="filterCategory('all', this)">Усі</button>
        <button class="chip" onclick="filterCategory('men', this)">Чоловіче</button>
        <button class="chip" onclick="filterCategory('women', this)">Жіноче</button>
        <button class="chip" onclick="filterCategory('hoodies', this)">Кофти / Худі</button>
        <button class="chip" onclick="filterCategory('pants', this)">Штани</button>
        <button class="chip" onclick="filterCategory('shoes', this)">Взуття</button>
    </div>

    <div class="container">
        <div id="catalog-section">
            <h2 class="section-title">Каталог товарів</h2>
            <div class="empty-state">
                <span style="font-size: 32px;">📦</span>
                <p>Товари поки не виставлені.<br>Слідкуйте за оновленнями каталогу!</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('catalog', this)">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            Каталог
        </button>
        <button class="nav-item" onclick="switchTab('saved', this)">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            Збережене
        </button>
        <button class="nav-item" onclick="switchTab('cart', this)">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Кошик
        </button>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            const container = document.getElementById('catalog-section');
            if (tabName === 'catalog') {
                container.innerHTML = `
                    <h2 class="section-title">Каталог товарів</h2>
                    <div class="empty-state">
                        <span style="font-size: 32px;">📦</span>
                        <p>Товари поки не виставлені.<br>Слідкуйте за оновленнями каталогу!</p>
                    </div>`;
            } else if (tabName === 'saved') {
                container.innerHTML = `
                    <h2 class="section-title">Збережені товари</h2>
                    <div class="empty-state">
                        <span style="font-size: 32px;">❤️</span>
                        <p>Список збереженого порожній.</p>
                    </div>`;
            } else if (tabName === 'cart') {
                container.innerHTML = `
                    <h2 class="section-title">Ваш кошик</h2>
                    <div class="empty-state">
                        <span style="font-size: 32px;">🛒</span>
                        <p>Кошик наразі порожній.</p>
                    </div>`;
            }
        }

        function filterCategory(category, element) {
            document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
